name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Security regression nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate workflow YAML syntax
        run: ./scripts/check-workflows.sh
      - name: Lint workflows with actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  action-refs:
    name: Action Ref Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate action refs and version comments
        run: |
          ./scripts/check-action-refs_test.sh
          ./scripts/check-action-refs.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-fast:
    name: Unit Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          GOG_LITE_KEYRING_BACKEND: file
          GOG_LITE_KEYRING_PASSWORD: ci-test-password
      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-failures
          path: /tmp/gog-lite-test-*.log
          if-no-files-found: ignore

  staticcheck:
    name: staticcheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  # PR and push keep the merge-time gate from #68. The 02:00 UTC schedule runs the
  # same scan so a new vulnerability database entry is not waiting on the next PR.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration-cli:
    name: CLI Integration Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Build CLI binary
        run: go build -o /tmp/gog-lite ./cmd/gog-lite/
      - name: preflight returns ready=false without credentials
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          out=$(/tmp/gog-lite auth preflight --account test@example.com)
          echo "$out"
          echo "$out" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['ready'] == False, 'expected ready=false'
          assert any(c['name'] == 'credentials' and not c['ok'] for c in d['checks']), 'expected credentials check to fail'
          print('preflight: OK')
          "
      - name: missing token is auth_required
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          export GOG_LITE_KEYRING_BACKEND=file
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          out_json=$(mktemp)
          err_json=$(mktemp)
          /tmp/gog-lite gmail labels --account test@example.com >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -eq 2 ]
          [ ! -s "$out_json" ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'auth_required', f\"got code {d['code']}\"
          print('missing-token-auth-required: OK')
          "
      - name: confirm-delete required for calendar delete
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          err_json=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'delete_requires_confirmation', f\"got code {d['code']}\"
          print('confirm-delete: OK')
          "
      - name: confirm-find-replace required for docs find-replace
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          err_json=$(mktemp)
          /tmp/gog-lite docs find-replace --account test@example.com --doc-id x --find a --replace b 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'find_replace_requires_confirmation', f\"got code {d['code']}\"
          print('confirm-find-replace: OK')
          "
      - name: policy denies blocked action (calendar.delete)
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          mkdir -p "$HOME/gog-lite"
          echo '{"allowed_actions":["calendar.get"]}' > "$HOME/gog-lite/policy.json"
          err_json=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'policy_denied', f\"got code {d['code']}\"
          print('policy-denied calendar.delete: OK')
          "
      - name: policy denies write commands
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          mkdir -p "$HOME/gog-lite"
          echo '{"allowed_actions":["calendar.get"]}' > "$HOME/gog-lite/policy.json"
          check_policy_denied() {
            cmd="$1"; label="$2"
            err_json=$(mktemp)
            eval "$cmd" 2>"$err_json" && code=0 || code=$?
            [ "$code" -ne 0 ] || { echo "FAIL: $label expected non-zero exit"; exit 1; }
            [ -s "$err_json" ] || { echo "FAIL: $label expected JSON error but stderr was empty"; exit 1; }
            python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'policy_denied', f\"$label: got code {d['code']}\"
          print('policy-denied $label: OK')
            "
          }
          check_policy_denied \
            "/tmp/gog-lite gmail send --account test@example.com --to a@b.com --subject x --body y" \
            "gmail.send"
          check_policy_denied \
            "/tmp/gog-lite calendar create --account test@example.com --title t --start 2026-03-01T10:00:00Z --end 2026-03-01T11:00:00Z" \
            "calendar.create"
          check_policy_denied \
            "/tmp/gog-lite calendar update --account test@example.com --event-id x --title t" \
            "calendar.update"
          check_policy_denied \
            "/tmp/gog-lite docs create --account test@example.com --title t" \
            "docs.create"
          check_policy_denied \
            "/tmp/gog-lite docs write --account test@example.com --doc-id x --content hello" \
            "docs.write"
          check_policy_denied \
            "/tmp/gog-lite docs find-replace --account test@example.com --doc-id x --find a --replace b" \
            "docs.find-replace"
          check_policy_denied \
            "/tmp/gog-lite docs export --account test@example.com --doc-id x --format pdf --output /tmp/out.pdf" \
            "docs.export"
          check_policy_denied \
            "/tmp/gog-lite sheets update --account test@example.com --spreadsheet-id x --range 'Sheet1!A1' --values '[[\"a\"]]'" \
            "sheets.update"
          check_policy_denied \
            "/tmp/gog-lite sheets append --account test@example.com --spreadsheet-id x --range Sheet1 --values '[[\"a\"]]'" \
            "sheets.append"
          check_policy_denied \
            "/tmp/gog-lite slides write --account test@example.com --presentation-id x --find a --replace b" \
            "slides.write"
      - name: approval-token required when missing
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          err_json=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', f\"got code {d['code']}\"
          print('approval-required-missing-token: OK')
          "
      - name: approval-token reuse rejected
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          export GOG_LITE_KEYRING_BACKEND=file
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          token=$(/tmp/gog-lite auth approval-token --account test@example.com --action calendar.delete --ttl 10m \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          token_file="$XDG_CONFIG_HOME/gog-lite/approvals/${token}.json"
          [ -s "$token_file" ] || { echo "approval token file was not written"; exit 1; }
          python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get('used') is False, {'used': d.get('used')}
          print('approval-token-issued-unused: OK')
          " "$token_file"
          # First use consumes the token, then fails at auth (no real credentials).
          first_out=$(mktemp)
          first_err=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete \
            --approval-token="$token" >"$first_out" 2>"$first_err" && first_code=0 || first_code=$?
          echo "first use exit code: $first_code"
          echo "first use stderr:"
          cat "$first_err"
          python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get('used') is True, {'used': d.get('used')}
          print('approval-token-marked-used: OK')
          " "$token_file" || {
            echo "approval token file was not marked used"
            echo "first use stdout:"
            cat "$first_out"
            exit 1
          }
          # Second use: the stored token is already used → approval_required.
          # No retry. A mismatch prints this stderr instead of sleeping over it.
          out_json=$(mktemp)
          err_json=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete \
            --approval-token="$token" >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "reuse exit code: $code"
          echo "reuse stderr:"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', d
          print('approval-token-reuse: OK')
          "
      - name: dry-run skips confirm and approval-token
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_KEYRING_BACKEND=file
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          out=$(/tmp/gog-lite --dry-run calendar delete --account test@example.com --event-id x)
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') == True, 'expected dry_run=true'
          assert d.get('action') == 'calendar.delete', f\"expected action calendar.delete, got {d.get('action')}\"
          print('dry-run-skips-token: OK')
          " "$out"
      - name: sheets update requires confirm and approval; values default to RAW
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_KEYRING_BACKEND=file
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          err_json=$(mktemp)
          /tmp/gog-lite sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1" --values '[["=SUM(A1)"]]' 2>"$err_json" && code=0 || code=$?
          echo "missing confirm exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'write_requires_confirmation', f\"got code {d['code']}\"
          print('sheets-update-confirm: OK')
          "
          err_json=$(mktemp)
          /tmp/gog-lite sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1" --values '[["a"]]' --confirm-write 2>"$err_json" && code=0 || code=$?
          echo "missing token exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', f\"got code {d['code']}\"
          print('sheets-update-approval: OK')
          "
          out=$(/tmp/gog-lite --dry-run sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1:B1" --values '[["Alice",30]]')
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') is True
          assert d.get('action') == 'sheets.update'
          assert d.get('params', {}).get('value_input') == 'RAW', d
          print('sheets-update-dry-run-raw: OK')
          " "$out"
          out=$(/tmp/gog-lite --dry-run sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!C1" --values '[["=SUM(A1:A3)"]]' --value-input USER_ENTERED)
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('params', {}).get('value_input') == 'USER_ENTERED', d
          print('sheets-update-user-entered: OK')
          " "$out"
          out=$(/tmp/gog-lite --dry-run sheets append --account test@example.com --spreadsheet-id x \
            --range Sheet1 --values '[["Bob",25]]')
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') is True
          assert d.get('action') == 'sheets.append'
          assert d.get('params', {}).get('value_input') == 'RAW', d
          print('sheets-append-dry-run-raw: OK')
          " "$out"
          err_json=$(mktemp)
          /tmp/gog-lite --dry-run sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1" --values '[["a"]]' --value-input FORMULA 2>"$err_json" && code=0 || code=$?
          echo "bad value-input exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'invalid_arguments', f\"got code {d['code']}\"
          print('sheets-update-invalid-value-input: OK')
          "

      - name: docs write --replace skips confirm and approval on dry-run
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          export GOG_LITE_KEYRING_BACKEND=file
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          err_json=$(mktemp)
          out_json=$(mktemp)
          /tmp/gog-lite docs write --account test@example.com --doc-id x --content hello --replace >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "missing confirm exit code: $code"
          cat "$err_json"
          [ "$code" -eq 1 ]
          [ ! -s "$out_json" ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'replace_requires_confirmation', f\"got code {d['code']}\"
          print('docs-write-replace-confirm: OK')
          "
          err_json=$(mktemp)
          out_json=$(mktemp)
          /tmp/gog-lite docs write --account test@example.com --doc-id x --content hello --replace --confirm-replace >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "missing token exit code: $code"
          cat "$err_json"
          [ "$code" -eq 4 ]
          [ ! -s "$out_json" ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', f\"got code {d['code']}\"
          print('docs-write-replace-approval: OK')
          "
          out=$(/tmp/gog-lite --dry-run docs write --account test@example.com --doc-id x --content hello --replace)
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') is True, d
          assert d.get('action') == 'docs.write', d
          params = d.get('params') or {}
          assert params.get('replace') is True, d
          assert params.get('confirm_replace') is False, d
          assert params.get('content_length') == 5, d
          print('docs-write-replace-dry-run: OK')
          " "$out"
          token=$(/tmp/gog-lite auth approval-token --account test@example.com --action docs.write.replace --ttl 10m \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          /tmp/gog-lite --dry-run docs write --account test@example.com --doc-id x --content hello --replace \
            --confirm-replace --approval-token="$token" >/dev/null || {
            echo "dry-run with approval token failed"
            exit 1
          }
          err_json=$(mktemp)
          out_json=$(mktemp)
          /tmp/gog-lite docs write --account test@example.com --doc-id x --content hello --replace \
            --confirm-replace --approval-token="$token" >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "token still valid exit code: $code"
          cat "$err_json"
          [ "$code" -eq 2 ]
          [ ! -s "$out_json" ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'auth_required', f\"got code {d['code']}\"
          print('docs-write-dry-run-keeps-token: OK')
          "
          err_json=$(mktemp)
          /tmp/gog-lite docs write --account test@example.com --doc-id x --content hello --replace \
            --confirm-replace --approval-token="$token" >/dev/null 2>"$err_json" && code=0 || code=$?
          echo "token consumed exit code: $code"
          cat "$err_json"
          [ "$code" -eq 4 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', f\"got code {d['code']}\"
          print('docs-write-token-consumed: OK')
          "
          allowed=$(mktemp -d)
          outside=$(mktemp -d)
          err_json=$(mktemp)
          out_json=$(mktemp)
          /tmp/gog-lite --dry-run --allowed-output-dir "$allowed" docs export \
            --account test@example.com --doc-id x --format pdf --output "$outside/out.pdf" \
            >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "export dry-run outside exit code: $code"
          cat "$err_json"
          [ "$code" -eq 4 ]
          [ ! -s "$out_json" ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'output_not_allowed', f\"got code {d['code']}\"
          print('docs-export-dry-run-output-not-allowed: OK')
          "
          err_json=$(mktemp)
          out_json=$(mktemp)
          /tmp/gog-lite --allowed-output-dir "$allowed" docs export \
            --account test@example.com --doc-id x --format pdf --output "$outside/out.pdf" \
            >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "export outside exit code: $code"
          cat "$err_json"
          [ "$code" -eq 4 ]
          [ ! -s "$out_json" ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'output_not_allowed', f\"got code {d['code']}\"
          print('docs-export-output-not-allowed: OK')
          "
          out=$(/tmp/gog-lite --dry-run --allowed-output-dir "$allowed" docs export \
            --account test@example.com --doc-id x --format pdf --output "$allowed/out.pdf")
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') is True, d
          assert d.get('action') == 'docs.export', d
          print('docs-export-dry-run-allowed: OK')
          " "$out"

      - name: audit log hmac chain rejects recomputation
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_KEYRING_BACKEND=file
          unset GOG_LITE_KEYRING_PASSWORD
          err_json=$(mktemp)
          /tmp/gog-lite --dry-run calendar delete --account test@example.com --event-id x 2>"$err_json" && code=0 || code=$?
          echo "missing keyring exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'audit_error', d
          print('audit-log-needs-keyring: OK')
          "
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          /tmp/gog-lite --dry-run calendar delete --account test@example.com --event-id one >/dev/null || {
            echo "expected first audit append to succeed"
            exit 1
          }
          /tmp/gog-lite --dry-run calendar delete --account test@example.com --event-id two >/dev/null || {
            echo "expected second audit append to succeed"
            exit 1
          }
          audit="$XDG_CONFIG_HOME/gog-lite/audit.log"
          python3 -c "
          import json
          lines = [json.loads(line) for line in open('$audit') if line.strip()]
          assert len(lines) == 2, lines
          assert lines[0]['hash_alg'] == 'hmac-sha256', lines[0]
          assert lines[1]['hash_alg'] == 'hmac-sha256', lines[1]
          assert 'prev_hash' not in lines[0], lines[0]
          assert lines[1]['prev_hash'] == lines[0]['hash'], lines
          assert lines[0]['action'] == 'calendar.delete', lines[0]
          print('audit-log-hmac-chain: OK')
          "
          python3 -c "
          import hashlib, json
          path = '$audit'
          lines = [json.loads(line) for line in open(path) if line.strip()]
          prev = ''
          rewritten = []
          for entry in lines:
              entry.pop('hash_alg', None)
              entry['action'] = 'tampered'
              entry['prev_hash'] = prev
              material = '|'.join([
                  entry['timestamp'],
                  entry['action'],
                  entry.get('account') or '',
                  entry.get('target') or '',
                  'true' if entry['dry_run'] else 'false',
                  entry.get('prev_hash') or '',
              ])
              entry['hash'] = hashlib.sha256(material.encode()).hexdigest()
              if not prev:
                  entry.pop('prev_hash', None)
              prev = entry['hash']
              rewritten.append(entry)
          with open(path, 'w') as fh:
              for entry in rewritten:
                  fh.write(json.dumps(entry, separators=(',', ':')) + '\n')
          print('audit-log-rewritten-as-sha256')
          "
          err_json=$(mktemp)
          /tmp/gog-lite --dry-run calendar delete --account test@example.com --event-id three 2>"$err_json" && code=0 || code=$?
          echo "recompute exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'audit_error', d
          print('audit-log-recompute-rejected: OK')
          "

