name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Security regression nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate workflow YAML syntax
        run: ./scripts/check-workflows.sh
      - name: Lint workflows with actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  action-refs:
    name: Action Ref Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate action refs and version comments
        run: |
          ./scripts/check-action-refs_test.sh
          ./scripts/check-action-refs.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-fast:
    name: Unit Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          GOG_LITE_KEYRING_BACKEND: file
          GOG_LITE_KEYRING_PASSWORD: ci-test-password
      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-failures
          path: /tmp/gog-lite-test-*.log
          if-no-files-found: ignore

  govulncheck:
    name: govulncheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration-cli:
    name: CLI Integration Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Build CLI binary
        run: go build -o /tmp/gog-lite ./cmd/gog-lite/
      - name: preflight returns ready=false without credentials
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          out=$(/tmp/gog-lite auth preflight --account test@example.com)
          echo "$out"
          echo "$out" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['ready'] == False, 'expected ready=false'
          assert any(c['name'] == 'credentials' and not c['ok'] for c in d['checks']), 'expected credentials check to fail'
          print('preflight: OK')
          "
      - name: confirm-delete required for calendar delete
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          err_json=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'delete_requires_confirmation', f\"got code {d['code']}\"
          print('confirm-delete: OK')
          "
      - name: confirm-find-replace required for docs find-replace
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          err_json=$(mktemp)
          /tmp/gog-lite docs find-replace --account test@example.com --doc-id x --find a --replace b 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'find_replace_requires_confirmation', f\"got code {d['code']}\"
          print('confirm-find-replace: OK')
          "
      - name: policy denies blocked action (calendar.delete)
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          mkdir -p "$HOME/gog-lite"
          echo '{"allowed_actions":["calendar.get"]}' > "$HOME/gog-lite/policy.json"
          err_json=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'policy_denied', f\"got code {d['code']}\"
          print('policy-denied calendar.delete: OK')
          "
      - name: policy denies write commands
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          mkdir -p "$HOME/gog-lite"
          echo '{"allowed_actions":["calendar.get"]}' > "$HOME/gog-lite/policy.json"
          check_policy_denied() {
            cmd="$1"; label="$2"
            err_json=$(mktemp)
            eval "$cmd" 2>"$err_json" && code=0 || code=$?
            [ "$code" -ne 0 ] || { echo "FAIL: $label expected non-zero exit"; exit 1; }
            [ -s "$err_json" ] || { echo "FAIL: $label expected JSON error but stderr was empty"; exit 1; }
            python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'policy_denied', f\"$label: got code {d['code']}\"
          print('policy-denied $label: OK')
            "
          }
          check_policy_denied \
            "/tmp/gog-lite gmail send --account test@example.com --to a@b.com --subject x --body y" \
            "gmail.send"
          check_policy_denied \
            "/tmp/gog-lite calendar create --account test@example.com --title t --start 2026-03-01T10:00:00Z --end 2026-03-01T11:00:00Z" \
            "calendar.create"
          check_policy_denied \
            "/tmp/gog-lite calendar update --account test@example.com --event-id x --title t" \
            "calendar.update"
          check_policy_denied \
            "/tmp/gog-lite docs create --account test@example.com --title t" \
            "docs.create"
          check_policy_denied \
            "/tmp/gog-lite docs write --account test@example.com --doc-id x --content hello" \
            "docs.write"
          check_policy_denied \
            "/tmp/gog-lite docs find-replace --account test@example.com --doc-id x --find a --replace b" \
            "docs.find-replace"
          check_policy_denied \
            "/tmp/gog-lite docs export --account test@example.com --doc-id x --format pdf --output /tmp/out.pdf" \
            "docs.export"
      - name: approval-token required when missing
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          err_json=$(mktemp)
          /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', f\"got code {d['code']}\"
          print('approval-required-missing-token: OK')
          "
      - name: approval-token reuse rejected
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_CLIENT_ID=dummy-id
          export GOG_LITE_CLIENT_SECRET=dummy-secret
          token=$(/tmp/gog-lite auth approval-token --account test@example.com --action calendar.delete --ttl 10m \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          echo "issued token"
          # First use: token is consumed; command then fails at auth (no real credentials).
          /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete \
            --approval-token "$token" 2>/dev/null && true || true
          # Second use: token already used → approval_required.
          check_reuse() {
            out_json=$(mktemp)
            err_json=$(mktemp)
            /tmp/gog-lite calendar delete --account test@example.com --event-id x --confirm-delete \
              --approval-token "$token" >"$out_json" 2>"$err_json" && code=0 || code=$?
            echo "exit code: $code"
            [ "$code" -ne 0 ] || return 1
            [ -s "$err_json" ] || return 1
            python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', f\"got code {d['code']}\"
          print('approval-token-reuse: OK')
            "
          }

          ok=0
          for i in 1 2; do
            if check_reuse; then
              ok=1
              break
            fi
            echo "retry approval-token reuse check ($i)"
            sleep 1
          done
          [ "$ok" -eq 1 ] || { echo "approval-token reuse check failed after retry"; exit 1; }
      - name: dry-run skips confirm and approval-token
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          out=$(/tmp/gog-lite --dry-run calendar delete --account test@example.com --event-id x)
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') == True, 'expected dry_run=true'
          assert d.get('action') == 'calendar.delete', f\"expected action calendar.delete, got {d.get('action')}\"
          print('dry-run-skips-token: OK')
          " "$out"
      - name: sheets update requires confirm and approval; values default to RAW
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          err_json=$(mktemp)
          /tmp/gog-lite sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1" --values '[["=SUM(A1)"]]' 2>"$err_json" && code=0 || code=$?
          echo "missing confirm exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'write_requires_confirmation', f\"got code {d['code']}\"
          print('sheets-update-confirm: OK')
          "
          err_json=$(mktemp)
          /tmp/gog-lite sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1" --values '[["a"]]' --confirm-write 2>"$err_json" && code=0 || code=$?
          echo "missing token exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'approval_required', f\"got code {d['code']}\"
          print('sheets-update-approval: OK')
          "
          out=$(/tmp/gog-lite --dry-run sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1:B1" --values '[["Alice",30]]')
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') is True
          assert d.get('action') == 'sheets.update'
          assert d.get('params', {}).get('value_input') == 'RAW', d
          print('sheets-update-dry-run-raw: OK')
          " "$out"
          out=$(/tmp/gog-lite --dry-run sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!C1" --values '[["=SUM(A1:A3)"]]' --value-input USER_ENTERED)
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('params', {}).get('value_input') == 'USER_ENTERED', d
          print('sheets-update-user-entered: OK')
          " "$out"
          out=$(/tmp/gog-lite --dry-run sheets append --account test@example.com --spreadsheet-id x \
            --range Sheet1 --values '[["Bob",25]]')
          echo "$out"
          python3 -c "
          import json, sys
          d = json.loads(sys.argv[1])
          assert d.get('dry_run') is True
          assert d.get('action') == 'sheets.append'
          assert d.get('params', {}).get('value_input') == 'RAW', d
          print('sheets-append-dry-run-raw: OK')
          " "$out"
          err_json=$(mktemp)
          /tmp/gog-lite --dry-run sheets update --account test@example.com --spreadsheet-id x \
            --range "Sheet1!A1" --values '[["a"]]' --value-input FORMULA 2>"$err_json" && code=0 || code=$?
          echo "bad value-input exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'invalid_arguments', f\"got code {d['code']}\"
          print('sheets-update-invalid-value-input: OK')
          "
      - name: emergency-revoke blocks locally when no refresh token is stored
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_KEYRING_BACKEND=file
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          out_json=$(mktemp)
          err_json=$(mktemp)
          /tmp/gog-lite auth emergency-revoke --account test@example.com >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          echo "stdout:"
          cat "$out_json"
          echo "stderr:"
          cat "$err_json"
          [ "$code" -eq 3 ]
          [ ! -s "$out_json" ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json, os
          d = json.load(open('$err_json'))
          assert d['code'] == 'remote_revoke_failed', f\"got code {d['code']}\"
          assert 'リモート失効に失敗した' in d.get('error', ''), d
          assert 'ブロック済み' in d.get('error', ''), d
          policy = os.path.join(os.environ['XDG_CONFIG_HOME'], 'gog-lite', 'policy.json')
          p = json.load(open(policy))
          blocked = p.get('blocked_accounts') or []
          assert 'test@example.com' in blocked, blocked
          print('emergency-revoke-no-token: OK')
          "
      - name: emergency-revoke dry-run does not block
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_KEYRING_BACKEND=file
          export GOG_LITE_KEYRING_PASSWORD=ci-test-password
          out_json=$(mktemp)
          err_json=$(mktemp)
          /tmp/gog-lite --dry-run auth emergency-revoke --account test@example.com >"$out_json" 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          echo "stdout:"
          cat "$out_json"
          echo "stderr:"
          cat "$err_json"
          [ "$code" -eq 0 ]
          [ ! -s "$err_json" ]
          [ -s "$out_json" ] || { echo "expected JSON on stdout"; exit 1; }
          python3 -c "
          import json, os
          d = json.load(open('$out_json'))
          assert d.get('dry_run') is True, d
          assert d.get('action') == 'auth.emergency_revoke', d
          assert d.get('params', {}).get('account') == 'test@example.com', d
          policy = os.path.join(os.environ['XDG_CONFIG_HOME'], 'gog-lite', 'policy.json')
          assert not os.path.exists(policy), policy
          audit = os.path.join(os.environ['XDG_CONFIG_HOME'], 'gog-lite', 'audit.log')
          line = open(audit).readline()
          entry = json.loads(line)
          assert entry.get('action') == 'auth.emergency_revoke', entry
          assert entry.get('dry_run') is True, entry
          print('emergency-revoke-dry-run: OK')
          "

  security-nightly:
    name: Security Regression (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Run security regression tests
        run: go test ./... -v -run 'TestAudit|TestApproval|TestPolicy|TestRateLimit|TestReadStdinWithLimit'
        env:
          GOG_LITE_KEYRING_BACKEND: file
          GOG_LITE_KEYRING_PASSWORD: ci-test-password
      - name: Build CLI binary
        run: go build -o /tmp/gog-lite ./cmd/gog-lite/
      - name: keyring file backend requires password
        run: |
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME"
          export GOG_LITE_KEYRING_BACKEND=file
          unset GOG_LITE_KEYRING_PASSWORD
          err_json=$(mktemp)
          /tmp/gog-lite auth list 2>"$err_json" && code=0 || code=$?
          echo "exit code: $code"
          cat "$err_json"
          [ "$code" -ne 0 ]
          [ -s "$err_json" ] || { echo "expected JSON error but stderr was empty"; exit 1; }
          python3 -c "
          import json
          d = json.load(open('$err_json'))
          assert d['code'] == 'keyring_error', f\"got code {d['code']}\"
          assert 'GOG_LITE_KEYRING_PASSWORD' in d.get('error', ''), f\"unexpected error: {d}\"
          print('keyring-file-no-password: OK')
          "
      - name: Upload security test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-test-results
          path: /tmp/gog-lite-security-*.log
          if-no-files-found: ignore

  # Public repositories disable schedule after 60 days without activity.
  # Re-enable from this job only; an empty commit would fight branch protection.
  keepalive:
    name: Keep scheduled workflows enabled
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/enable"
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/enable"
